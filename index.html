<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATM Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center">

    <div class="atm-container p-4 rounded-4 shadow-lg">
        <h2 class="text-center text-light mb-3">HDCF BANK ATM</h2>
        
        <div class="row gx-0">
            <div class="col-2 d-flex flex-column justify-content-around py-5">
                <button class="atm-btn" onclick="showDeposit()">1</button>
                <button class="atm-btn" onclick="showWithdraw()">2</button>
            </div>

            <div class="col-8">
                <div id="screen" class="atm-screen p-4 d-flex flex-column align-items-center justify-content-center text-center">
                    <div id="display-content" class="w-100">
                        <h4 class="mb-4">Welcome to HDCF Bank</h4>
                        <input type="text" id="username" class="form-control mb-2" placeholder="Username">
                        <input type="password" id="password" class="form-control mb-2" placeholder="Password">
                        <button class="btn btn-success w-100" onclick="handleLogin()">LOGIN</button>
                    </div>
                </div>
            </div>

            <div class="col-2 d-flex flex-column justify-content-around py-5">
                <button class="atm-btn" onclick="checkBalance()">3</button>
                <button class="atm-btn" onclick="handleLogout()">4</button>
            </div>
        </div>

        <div class="keypad mt-4 p-3 rounded bg-secondary d-flex justify-content-center">
            <div class="row g-2" style="width: 200px;">
                <button class="col-4 btn btn-light" onclick="typeKey('1')">1</button>
                <button class="col-4 btn btn-light" onclick="typeKey('2')">2</button>
                <button class="col-4 btn btn-light" onclick="typeKey('3')">3</button>
                <button class="col-4 btn btn-light" onclick="typeKey('4')">4</button>
                <button class="col-4 btn btn-light" onclick="typeKey('5')">5</button>
                <button class="col-4 btn btn-light" onclick="typeKey('6')">6</button>
                <button class="col-4 btn btn-light" onclick="typeKey('7')">7</button>
                <button class="col-4 btn btn-light" onclick="typeKey('8')">8</button>
                <button class="col-4 btn btn-light" onclick="typeKey('9')">9</button>
                <button class="col-4 btn btn-danger" onclick="clearKey()">CLR</button>
                <button class="col-4 btn btn-light" onclick="typeKey('0')">0</button>
                <button class="col-4 btn btn-warning" onclick="handleEnter()">ENT</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
